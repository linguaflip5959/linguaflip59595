<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шифратор LinguaFlip</title>
<style>
  body { font-family: sans-serif; background: #f4ede2; padding: 20px; color: #1f1a14; }
  textarea { width: 100%; max-width: 500px; height: 150px; padding: 10px; border-radius: 8px; border: 1px solid #d9cdb6; font-family: monospace; }
  button { padding: 10px 20px; background: #c2410c; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px 0; }
  .result { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #d9cdb6; white-space: pre-wrap; word-wrap: break-word; font-family: monospace; }
</style>
</head>
<body>

  <h2>🔐 Шифратор кодов LinguaFlip</h2>
  <p>Вводи коды по одному на строку в формате: <b>КОД | НАГРАДА</b></p>
  <p>Например:<br>
  LF-NEWYEAR-2024 | theme-newyear<br>
  LF-TUMBLE-2024 | anim-3d-tumble</p>

  <textarea id="input">LF-TUMBLE-2024 | anim-3d-tumble
LF-BOOK-2024 | anim-page-flip
LF-ZOOM-2024 | anim-zoom-flip
LF-VERT-2024 | anim-vertical-flip
LF-TWIST-2024 | anim-twist-flip
LF-CYBER-2024 | anim-cyber-reveal
LF-OCEAN-2024 | theme-ocean
LF-FOREST-2024 | theme-forest
LF-COSMOS-2024 | theme-cosmos
LF-NEWYEAR-2024 | theme-newyear</textarea>

  <br>
  <button onclick="encode()">Зашифровать и получить код</button>

  <h3>Скопируй этот массив и вставь в app.js:</h3>
  <div class="result" id="output"></div>

  <script>
    function encodeString(str) {
      // 1. Переворачиваем строку задом наперед
      const reversed = str.split('').reverse().join('');
      // 2. Кодируем в Base64
      return btoa(reversed);
    }

    function encode() {
      const input = document.getElementById('input').value;
      const lines = input.split('\n');
      let result = "const _0x4f2a = [\n";
      
      lines.forEach(line => {
        if (!line.trim()) return;
        const parts = line.split('|').map(p => p.trim());
        if (parts.length === 2) {
          const encCode = encodeString(parts[0]);
          const encReward = encodeString(parts[1]);
          result += `  ["${encCode}", "${encReward}"],\n`;
        }
      });
      
      result += "];";
      document.getElementById('output').textContent = result;
    }
  </script>
</body>
</html>
