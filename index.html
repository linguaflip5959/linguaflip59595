<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="./styles.css">
<title>LinguaFlip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function() {
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch(e) {}
  })();
</script>
</head>
<body>

<header>
  <div class="brand">
    <img src="icon-192.png" alt="LinguaFlip" class="brand-logo">
    <h1>Lingua<em>Flip</em></h1>
  </div>
  <div class="header-actions">
    <button class="icon-btn level-btn" id="level-btn" aria-label="Уровень сложности">A1</button>
    <button class="icon-btn" id="reverse-toggle" aria-label="Сменить направление">⇄</button>
    <button class="icon-btn" id="constructor-toggle" aria-label="Конструктор фраз">🧩</button>
    <span class="counter" id="counter">1 / 10</span>
    <span class="stats" id="stats-badge"><span class="ok">0</span> / <span class="err">0</span></span>
    <button class="icon-btn" id="theme-toggle" aria-label="Сменить тему">
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <button class="icon-btn" id="gift-btn" aria-label="Ввести код поддержки">🎁</button>
    <button class="icon-btn" id="donate-btn" aria-label="Поддержать проект">❤</button>
    <button class="icon-btn" id="save-btn" aria-label="Сохранить прогресс">⬇</button>
    <button class="icon-btn" id="load-btn" aria-label="Восстановить прогресс">⬆</button>
    <input type="file" id="file-input" accept=".json" style="display:none">
  </div>
</header>

<main>
  <!-- FLASHCARDS VIEW -->
  <section class="view active" id="view-cards">
    <div class="chips-row">
      <div class="chips-container" id="topic-chips"></div>
    </div>
    <div class="topic-progress-bar">
      <div class="topic-progress-fill" id="topic-progress-fill"></div>
    </div>
    
    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div>
            <div class="card-tag" id="front-tag">Слово</div>
            <div class="word" id="card-word">—</div>
            <div class="transcription" id="card-trans">—</div>
            
            <input type="text" id="practice-input" class="practice-input" placeholder="Введи слово..." style="display:none;">
            
            <div id="constructor-ui" style="display:none;">
              <div class="grammar-hint">
                <span class="gh-subj">Subject</span> + <span class="gh-verb">Verb</span> + <span class="gh-obj">Object</span>
              </div>
              <div class="constructor-answer" id="constructor-answer"></div>
              <div class="constructor-chips" id="constructor-chips"></div>
            </div>
          </div>
          
          <button class="action-btn practice-btn" id="practice-btn" style="display:none;">Проверить</button>
          <button class="action-btn practice-btn" id="constructor-check-btn" style="display:none;">Проверить фразу</button>
          <div class="hint" id="card-hint"><span class="dot"></span> нажми, чтобы перевернуть</div>
        </div>
        <div class="face back">
          <div>
            <div class="card-tag" id="back-tag">Перевод</div>
            <div class="translation" id="card-translation">—</div>
            <div class="transcription" id="card-trans-back" style="display:none; margin-top: 4px;">—</div>
          </div>
          <div class="example-block">
            <div class="example-en" id="card-example">—</div>
            <div class="example-ru" id="card-example-ru">—</div>
          </div>
          
          <div class="card-actions binary-actions" id="binary-actions">
            <button class="action-btn dont-know-btn" id="dont-know-btn">Не знаю</button>
            <button class="action-btn know-btn" id="know-btn">Знаю</button>
          </div>
          
          <div class="card-actions srs-actions" id="srs-actions" style="display: none;">
            <button class="srs-btn srs-again" data-grade="1">Снова</button>
            <button class="srs-btn srs-hard" data-grade="2">Трудно</button>
            <button class="srs-btn srs-good" data-grade="3">Хорошо</button>
            <button class="srs-btn srs-easy" data-grade="4">Легко</button>
          </div>
        </div>
      </div>
    </div>
    <div class="card-nav">
      <button class="nav-btn" id="prev-btn" aria-label="Назад">‹</button>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <button class="nav-btn" id="next-btn" aria-label="Вперёд">›</button>
    </div>
    <div class="progress-label" id="progress-label">Карточка 1 из 10</div>
  </section>

  <!-- TABLE VIEW -->
  <section class="view" id="view-table">
    <div class="table-wrap" id="table-wrap">
      <div class="table-head">
        <div class="table-type-row">
          <label for="table-type">Тип</label>
          <select id="table-type">
            <option value="verbs">Глаголы</option>
            <option value="pronouns" disabled>Местоимения</option>
            <option value="adjectives" disabled>Прилагательные</option>
            <option value="numerals" disabled>Числительные</option>
          </select>
        </div>
        <div class="chips-row" style="margin: 0;">
          <div class="chips-container" id="verb-chips"></div>
        </div>
        <div class="modes">
          <button class="mode-btn active" data-mode="view">Смотреть</button>
          <button class="mode-btn" data-mode="self">Самопроверка</button>
          <button class="mode-btn" data-mode="input">Ввод</button>
        </div>
      </div>

      <div class="input-panel" id="input-panel" style="display:none;">
        <div class="input-coord">
          <small>Введите форму</small>
          <span id="input-coord-text">—</span>
        </div>
        <div class="input-row">
          <input type="text" id="answer-input" placeholder="форма глагола…" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <button class="check-btn" id="check-btn">Проверить</button>
        <div class="feedback" id="feedback"></div>
        <button class="skip-btn" id="skip-btn">пропустить →</button>
      </div>

      <div class="table-scroll">
        <table class="verbs mode-view" id="verbs-table"></table>
      </div>
      <div class="table-hint" id="table-hint">Нажми на ячейку, чтобы услышать произношение</div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-tab active" data-view="cards">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="14" height="16" rx="2"/><path d="M8 3v2M16 3v2"/></svg>
      Карточки
    </button>
    <button class="nav-tab" data-view="table">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 5v14"/></svg>
      Таблица
    </button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script src="./data_en.js"></script>
<script src="./app.js" defer></script>
</body>
</html>
